; iTunes.SMTC 在线封面兜底配置 / Online artwork fallback configuration
;
; 放置位置 / Where to put it:
;   %LOCALAPPDATA%\iTunes.SMTC\artwork-fallback.ini
; 修改后需要重启 iTunes.SMTC 生效 / Restart iTunes.SMTC after editing.
;
; 这个文件是可选的。没有它时，程序按下面的默认值运行。
; This file is optional. Without it the defaults below apply.

[Artwork]
; 1 = 开启在线兜底；0 = 关闭，退回原始行为（流媒体曲目只显示灰色占位图）
; 1 = enable the online fallback; 0 = disable it (placeholder only, upstream behaviour)
Enabled=1

; 区服顺序，逗号分隔。实测 cn 区服搜索接口对任何关键词都返回 0 条结果，不要放 cn。
; Storefront order, comma separated. Measured: cn returns 0 results for every query, do not add it.
Storefronts=tw,hk,us

; 1 = 每次切歌往 artwork-fallback.log 追加诊断行（COM 是否给出封面、搜索得分多少）
; 1 = append one diagnostic line per track change to artwork-fallback.log
DebugLog=1
